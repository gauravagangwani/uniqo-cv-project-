<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airdraw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,700&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg:        #3a3b3e;
      --bg-2:      #34353a;
      --panel:     #2e2f33;
      --panel-2:   #404145;
      --line:      #4d4e53;
      --line-soft: #45464b;
      --ink:       #ece8df;
      --ink-dim:   #b5afa1;
      --ink-mute:  #807a6e;
      --accent:    #ff3d8a;
      --accent-2:  #ffd66b;
      --accent-3:  #6ad7c8;
      --accent-4:  #c8a8ff;
      --danger:    #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body, #root {
      margin: 0; padding: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: 'Fraunces', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content:''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1px);
      background-size: 3px 3px; opacity: 0.18; mix-blend-mode: overlay;
    }
    body::after {
      content:''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(800px 540px at 85% 10%, rgba(255,61,138,0.07), transparent 60%),
        radial-gradient(700px 500px at 8% 90%,  rgba(106,215,200,0.06), transparent 60%);
    }
    #root { position: relative; z-index: 1; }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    a { color: inherit; text-decoration: none; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }

    .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; }
    .script { font-family: 'Allura', cursive; font-weight: 400; }

    /* ── rail ── */
    .rail {
      position: fixed; top: 0; left: 0; bottom: 0; width: 80px;
      border-right: 1px solid var(--line-soft);
      background: rgba(46,47,51,0.55);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 22px 0; z-index: 50;
    }
    .railMark {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: 'Allura', cursive; font-size: 30px; color: var(--ink); cursor: pointer;
    }
    .railNav { display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .railLink {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.28em; color: var(--ink-mute); padding: 6px 0; position: relative;
      transition: color 160ms ease;
    }
    .railLink:hover, .railLink.active { color: var(--ink); }
    .railLink.active::before {
      content:''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 18px; background: var(--accent);
    }
    .railFoot {
      display: flex; flex-direction: column; gap: 14px; align-items: center;
      font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-mute); letter-spacing: 0.2em;
    }
    .railFoot .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 12px var(--accent); animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* ── layout ── */
    .page { padding-left: 80px; min-height: 100vh; }
    .topStrip {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 56px 14px; border-bottom: 1px dashed var(--line-soft);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-mute); letter-spacing: 0.2em;
    }
    .topStrip .crosshair { display: flex; align-items: center; gap: 8px; }

    /* ── hero ── */
    .hero {
      padding: 64px 56px 80px;
      display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px;
      opacity: 0; transform: translateY(18px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .hero.in { opacity: 1; transform: translateY(0); }
    .heroLabel {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.28em; color: var(--accent);
      display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
    }
    .heroLabel .ln { width: 36px; height: 1px; background: var(--accent); display: inline-block; }
    .heroTitle {
      margin: 0; font-family: 'Fraunces', serif; font-weight: 400;
      font-size: clamp(58px, 7.6vw, 122px); line-height: 0.92;
      letter-spacing: -0.025em; color: var(--ink);
    }
    .heroTitle .scriptWord {
      font-family: 'Allura', cursive; font-size: 1.55em; line-height: 0.7;
      color: var(--accent); display: inline-block; vertical-align: -0.06em;
    }
    .heroTitle .scriptWord.amber { color: var(--accent-2); }
    .heroTitle em { font-style: italic; font-weight: 300; color: var(--ink-dim); }
    .heroLead {
      max-width: 480px; margin-top: 28px;
      font-family: 'Fraunces', serif; font-weight: 300;
      font-size: 17px; line-height: 1.55; color: var(--ink-dim);
    }
    .ctaRow { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 32px; }
    .cta {
      display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.22em; font-weight: 600; text-transform: uppercase;
      transition: transform 140ms ease, background 140ms ease, color 140ms ease;
    }
    .cta:hover { transform: translateY(-1px); }
    .ctaSolid { background: var(--ink); color: var(--bg); }
    .ctaSolid:hover { background: var(--accent-2); }
    .ctaMagic { background: var(--accent); color: var(--bg); }
    .ctaMagic:hover { background: #ff6aa6; }
    .ctaGhost { border: 1px solid var(--line); color: var(--ink-dim); }
    .ctaGhost:hover { color: var(--ink); border-color: var(--ink-dim); }
    .cta .arr { font-family: 'Allura', cursive; font-size: 22px; letter-spacing: 0; line-height: 0; }
    .heroSpecs {
      display: flex; margin-top: 56px;
      border-top: 1px solid var(--line-soft); padding-top: 22px;
    }
    .spec { padding-right: 36px; margin-right: 36px; border-right: 1px solid var(--line-soft); }
    .spec:last-child { border-right: none; }
    .spec .v { font-family: 'Allura', cursive; font-size: 40px; line-height: 1; color: var(--ink); }
    .spec .l { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-mute); letter-spacing: 0.24em; margin-top: 4px; }
    .heroRight { position: relative; display: flex; align-items: center; justify-content: center; }
    .heroCard {
      position: relative; width: 100%; max-width: 560px; aspect-ratio: 4/3;
      background: #232428; border: 1px solid var(--line); overflow: hidden;
    }
    .heroCard canvas { display: block; width: 100%; height: 100%; }
    .heroCard::before {
      content:''; position: absolute; inset:0;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.55); pointer-events: none; z-index: 2;
    }
    .heroCard .tag {
      position: absolute; top: 16px; left: 18px; z-index: 3;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-dim); letter-spacing: 0.24em;
      display: flex; align-items: center; gap: 8px;
    }
    .heroCard .tag .d {
      width:6px; height:6px; border-radius:50%; background: var(--accent);
      box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s ease-in-out infinite;
    }
    .heroCard .hcorner { position: absolute; width: 22px; height: 22px; border: 1px solid var(--accent); z-index: 3; }
    .heroCard .hc1 { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .heroCard .hc2 { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .heroCard .hc3 { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .heroCard .hc4 { bottom: 8px; right: 8px; border-left: none; border-top: none; }
    .heroCardCaption {
      position: absolute; right: -14px; top: 50%;
      transform: rotate(90deg) translate(40px, 14px);
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-mute); letter-spacing: 0.28em; pointer-events: none;
    }

    /* ── notes strip ── */
    .notesRow {
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
      border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
    }
    .note { padding: 28px 32px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 10px; }
    .note:last-child { border-right: none; }
    .note .h { font-family: 'Allura', cursive; font-size: 30px; line-height: 1; color: var(--ink); }
    .note .b { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); line-height: 1.6; letter-spacing: 0.04em; }

    /* ── chapters ── */
    .chapters { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line-soft); }
    .chapter {
      padding: 56px 48px; border-right: 1px solid var(--line-soft);
      display: flex; flex-direction: column; gap: 16px;
      overflow: hidden; transition: background 200ms ease;
    }
    .chapter:hover { background: rgba(0,0,0,0.08); }
    .chapter:last-child { border-right: none; }
    .chapter .num { font-family: 'Fraunces', serif; font-weight: 300; font-size: 80px; line-height: 1; color: var(--ink-mute); letter-spacing: -0.03em; }
    .chapter .name { font-family: 'Allura', cursive; font-size: 96px; line-height: 0.85; margin: -8px 0 0; }
    .chapter.draw  .name { color: var(--accent-2); }
    .chapter.magic .name { color: var(--accent); }
    .chapter .body { font-family: 'Fraunces', serif; font-size: 16px; line-height: 1.55; color: var(--ink-dim); max-width: 420px; margin-top: 6px; }
    .chapter .glist { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); }
    .glist .r { display: flex; align-items: center; gap: 12px; }
    .glist .r .g { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); color: var(--ink); font-size: 14px; }
    .chapter .open {
      margin-top: 24px; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 12px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.22em; color: var(--ink);
      padding-bottom: 6px; border-bottom: 1px solid currentColor;
    }
    .chapter .open .arr { font-family: 'Allura', cursive; font-size: 22px; line-height: 0; }

    /* ── how ── */
    .how { padding: 80px 56px; display: grid; grid-template-columns: 1fr 2fr; gap: 56px; border-bottom: 1px solid var(--line-soft); }
    .how .h { font-family: 'Allura', cursive; font-size: 92px; line-height: 0.85; color: var(--ink); }
    .steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; }
    .step { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line-soft); padding-top: 18px; }
    .step .n { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.22em; }
    .step .t { font-family: 'Fraunces', serif; font-size: 22px; color: var(--ink); font-weight: 400; }
    .step .d { font-family: 'Fraunces', serif; font-size: 14px; color: var(--ink-dim); line-height: 1.6; font-weight: 300; }

    /* ── footer ── */
    .footer {
      padding: 32px 56px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); letter-spacing: 0.16em;
    }
    .footer .center { font-family: 'Allura', cursive; font-size: 44px; line-height: 1; color: var(--ink); letter-spacing: 0; }
    .footer .r { text-align: right; }

    /* ── toolbar ── */
    .toolbar {
      height: 60px; width: 100%;
      background: rgba(46,47,51,0.72); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line-soft);
      display: flex; align-items: center; padding: 0 28px; gap: 24px;
      position: relative; z-index: 10;
    }
    .tbL, .tbC, .tbR { display: flex; align-items: center; gap: 16px; }
    .tbC { flex: 1; justify-content: center; }
    .tbR { justify-content: flex-end; }
    .tbMark { font-family: 'Allura', cursive; font-size: 32px; color: var(--ink); line-height: 1; cursor: pointer; }
    .modeTabs { display: flex; border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); height: 60px; }
    .modeTab {
      padding: 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-mute); letter-spacing: 0.24em; border-right: 1px solid var(--line-soft);
      transition: color 140ms ease, background 140ms ease;
    }
    .modeTab:last-child { border-right: none; }
    .modeTab.activeDraw  { color: var(--accent-2); background: rgba(255,214,107,0.06); }
    .modeTab.activeMagic { color: var(--accent);   background: rgba(255,61,138,0.06); }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; padding: 7px 12px; border: 1px solid currentColor; }
    .brushControls { display: flex; align-items: center; gap: 12px; }
    .range { width: 140px; height: 16px; }
    .range::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
    .range::-moz-range-track { height: 2px; background: var(--line); }
    .range::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent-2); border: none; margin-top: -5px; }
    .range::-moz-range-thumb { width: 12px; height: 12px; background: var(--accent-2); border: none; }
    .weight { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); min-width: 22px; text-align: right; }
    .swatches { display: flex; gap: 10px; }
    .swatch { width: 16px; height: 16px; padding: 0; border: none; }
    .swatch:hover { transform: scale(1.18); }
    .swatch.active { outline: 1px solid var(--ink); outline-offset: 3px; }
    .shapeButtons { display: flex; border: 1px solid var(--line); }
    .shapeBtn { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); padding: 6px 10px; border-right: 1px solid var(--line); letter-spacing: 0.1em; }
    .shapeBtn:last-child { border-right: none; }
    .shapeBtn.active { color: var(--bg); background: var(--accent); }
    .iconRow { display: flex; border: 1px solid var(--line); }
    .iconBtn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--line); color: var(--ink-dim); }
    .iconBtn:last-child { border-right: none; }
    .iconBtn:hover { color: var(--ink); background: rgba(0,0,0,0.18); }

    /* ── canvas app ── */
    .appShell { display: flex; flex-direction: column; min-height: 100vh; }
    .canvasShell { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .canvasFrame {
      position: relative; width: 100%;
      max-width: min(100%, calc((100vh - 80px) * 4 / 3));
      aspect-ratio: 4/3; background: #1d1e22; border: 1px solid var(--line); overflow: hidden;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.55), 0 30px 80px -30px rgba(0,0,0,0.6);
    }
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .corner { position: absolute; width: 22px; height: 22px; border: 1px solid var(--ink-dim); z-index: 4; pointer-events: none; }
    .corner.c1 { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .corner.c2 { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .corner.c3 { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .corner.c4 { bottom: 10px; right: 10px; border-left: none; border-top: none; }
    .gate {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(29,30,34,0.94); text-align: center; padding: 32px; gap: 18px;
    }
    .gate .big { font-family: 'Allura', cursive; font-size: 74px; color: var(--ink); line-height: 0.9; }
    .gate .sub { font-family: 'Fraunces', serif; font-weight: 300; font-size: 16px; color: var(--ink-dim); max-width: 440px; line-height: 1.55; }
    .gate .acts { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
    .gate code { color: var(--accent-2); }
    .hint {
      position: absolute; bottom: 18px; left: 18px; right: 18px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-dim); letter-spacing: 0.2em; pointer-events: none; z-index: 5;
    }
    .hint .l, .hint .r { padding: 7px 12px; background: rgba(29,30,34,0.72); border: 1px solid var(--line); }
    .fader { opacity: 1; transition: opacity 220ms ease; }
    .fader.fading { opacity: 0; }

    /* ── responsive ── */
    @media (max-width: 1000px) {
      .hero { grid-template-columns: 1fr; padding: 48px 28px; gap: 40px; }
      .heroCardCaption { display: none; }
    }
    @media (max-width: 900px) {
      .chapters { grid-template-columns: 1fr; }
      .chapter { border-right: none; border-bottom: 1px solid var(--line-soft); }
      .notesRow { grid-template-columns: 1fr 1fr; }
      .how { grid-template-columns: 1fr; padding: 56px 28px; gap: 28px; }
      .steps { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .page { padding-left: 0; }
      .rail { position: relative; width: 100%; height: 56px; flex-direction: row; padding: 0 18px; border-right: none; border-bottom: 1px solid var(--line-soft); }
      .railMark, .railLink { writing-mode: horizontal-tb; transform: none; }
      .railFoot { display: none; }
      .topStrip, .footer { padding: 14px 28px; }
      .footer { grid-template-columns: 1fr; text-align: center; }
      .footer .r { text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react,env">
    const { useEffect, useRef, useState, useCallback } = React;

    /* ── router ── */
    function getRoute() {
      const h = window.location.hash.replace(/^#/, "");
      if (h === "/draw")  return "/draw";
      if (h === "/magic") return "/magic";
      return "/";
    }
    function navigate(r) { window.location.hash = r; }

    /* ── hand connections + tips ── */
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17],
    ];
    const TIPS = [4, 8, 12, 16, 20];

    /* ── gesture classifier ── */
    function isHandClosed(lm) {
      if (!lm || lm.length < 21) return false;
      return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
    }

    function classifyGesture(lm) {
      if (!lm || lm.length < 21) return "idle";
      const d = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
      if (d < 0.06) return "pan";
      const ix = lm[8].y  < lm[6].y;
      const mx = lm[12].y < lm[10].y;
      const rx = lm[16].y < lm[14].y;
      const px = lm[20].y < lm[18].y;
      if (ix && mx && rx && px) return "erase";
      if (ix && !mx && !rx)     return "draw";
      return "idle";
    }

    /* ── particles ── */
    const GRAVITY = 0.04;
    const MAX_P = 1100;

    function spawnAt(arr, x, y, color, shape, now, sizeMul = 1) {
      const count = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        arr.push({
          x: x + (Math.random() - 0.5) * 14,
          y: y + (Math.random() - 0.5) * 14,
          vx: (Math.random() - 0.5) * 1.6,
          vy: -(0.4 + Math.random() * 1.6),
          size: (2.5 + Math.random() * 4.5) * sizeMul,
          color, shape, alpha: 1,
          lifetime: 700 + Math.random() * 600,
          born: now,
          rot: Math.random() * Math.PI * 2,
        });
      }
      if (arr.length > MAX_P) arr.splice(0, arr.length - MAX_P);
    }

    function stepParticles(arr, now) {
      for (let i = arr.length - 1; i >= 0; i--) {
        const p = arr[i];
        p.x += p.vx; p.y += p.vy; p.vy += GRAVITY;
        p.alpha = Math.max(0, 1 - (now - p.born) / p.lifetime);
        if (p.alpha <= 0) arr.splice(i, 1);
      }
    }

    function drawStar(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + p.born * 0.002);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const oa = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const ox = Math.cos(oa) * p.size, oy = Math.sin(oa) * p.size;
        if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
        const ia = ((i * 4 + 2) * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(ia) * p.size * 0.4, Math.sin(ia) * p.size * 0.4);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    function drawDot(ctx, p) {
      ctx.save();
      ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    function drawSparkle(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.born * 0.003);
      ctx.globalAlpha = p.alpha; ctx.strokeStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 6;
      ctx.lineWidth = 1.2; ctx.lineCap = "round";
      const r = p.size;
      ctx.beginPath();
      ctx.moveTo(-r, 0); ctx.lineTo(r, 0);
      ctx.moveTo(0, -r); ctx.lineTo(0, r);
      ctx.moveTo(-r*.6,-r*.6); ctx.lineTo(r*.6, r*.6);
      ctx.moveTo(-r*.6, r*.6); ctx.lineTo(r*.6,-r*.6);
      ctx.stroke(); ctx.restore();
    }
    function renderParticles(ctx, arr) {
      for (const p of arr) {
        if (p.shape === "star") drawStar(ctx, p);
        else if (p.shape === "dot") drawDot(ctx, p);
        else drawSparkle(ctx, p);

    }

    /* ── Hero demo canvas (animated constellation) ── */
    function HeroDemoCanvas() {
      const ref = useRef(null);
      useEffect(() => {
        const cv = ref.current; if (!cv) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        function resize() {
          cv.width  = cv.clientWidth  * dpr;
          cv.height = cv.clientHeight * dpr;
        }
        resize();
        window.addEventListener("resize", resize);
        const ctx = cv.getContext("2d");
        const particles = [];
        const tStart = performance.now();
        let rafId = 0;

        function frame() {
          const now = performance.now();
          const t = (now - tStart) / 1000;
          const W = cv.width, H = cv.height;
          ctx.clearRect(0, 0, W, H);

          const hands = [
            { cx: W*0.30, cy: H*0.58, sc: 0.22*H, ph: 0,   color: "#ff3d8a" },
            { cx: W*0.70, cy: H*0.42, sc: 0.22*H, ph: 1.7, color: "#ffd66b" },
          ];

          const handsLm = hands.map(h => {
            const breathing = 1 + Math.sin(t*0.6 + h.ph)*0.08;
            const driftX = Math.sin(t*0.5 + h.ph)*(W*0.025);
            const driftY = Math.cos(t*0.7 + h.ph)*(H*0.02);
            const lm = [];
            lm.push({ x: h.cx+driftX, y: h.cy+driftY+h.sc*0.6 });
            for (let f = 0; f < 5; f++) {
              const ang = (-Math.PI/2) + (f-2)*0.38 + Math.sin(t*1.2+f+h.ph)*0.08;
              for (let j = 1; j <= 4; j++) {
                const r = h.sc*breathing*(0.20+j*0.18);
                lm.push({ x: h.cx+driftX+Math.cos(ang)*r, y: h.cy+driftY+Math.sin(ang)*r+h.sc*0.6 });
              }
            }
            return { lm, color: h.color };
          });

          ctx.save();
          ctx.lineWidth = 1*dpr;
          for (const { lm, color } of handsLm) {
            ctx.strokeStyle = color; ctx.globalAlpha = 0.55;
            ctx.beginPath();
            for (const [a,b] of HAND_CONNECTIONS) {
              ctx.moveTo(lm[a].x, lm[a].y);
              ctx.lineTo(lm[b].x, lm[b].y);
            }
            ctx.stroke();
          }
          if (handsLm.length === 2) {
            ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = 0.10;
            ctx.beginPath();
            for (const ti of TIPS) {
              ctx.moveTo(handsLm[0].lm[ti].x, handsLm[0].lm[ti].y);
              ctx.lineTo(handsLm[1].lm[ti].x, handsLm[1].lm[ti].y);
            }
            ctx.stroke();
          }
          ctx.restore();

          for (const { lm, color } of handsLm) {
            for (let i = 0; i < lm.length; i++) {
              if (Math.random() < 0.45)
                spawnAt(particles, lm[i].x, lm[i].y, color, "star", now, 1.2);
            }
          }
          stepParticles(particles, now);
          renderParticles(ctx, particles);

          ctx.save();
          for (const { lm, color } of handsLm) {
            ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10*dpr;
            for (const p of lm) {
              ctx.beginPath(); ctx.arc(p.x, p.y, 2.5*dpr, 0, Math.PI*2); ctx.fill();
            }
          }
          ctx.restore();

          rafId = requestAnimationFrame(frame);
        }
        rafId = requestAnimationFrame(frame);
        return () => { cancelAnimationFrame(rafId); window.removeEventListener("resize", resize); };
      }, []);
      return <canvas ref={ref} />;
    }

    /* ── Hand tracking hook ── */
    function useHandTracking() {
      const [status, setStatus] = useState("idle");
      const videoRef  = useRef(null);
      const handsRef  = useRef(null);
      const framesRef = useRef({ hands: [] });
      const lastSent  = useRef(0);
      const sending   = useRef(false);

      const start = useCallback(async () => {
        if (!navigator.mediaDevices?.getUserMedia) { setStatus("not-supported"); return; }
        if (!window.Hands) { setStatus("load-failed"); return; }
        if (!videoRef.current) {
          const v = document.createElement("video");
          v.setAttribute("playsinline", "true");
          v.muted = true; v.style.display = "none";
          document.body.appendChild(v);
          videoRef.current = v;
        }
        setStatus("requesting");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { width:640, height:480, facingMode:"user" }, audio:false });
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        } catch { setStatus("denied"); return; }
        try {
          const hands = new window.Hands({
            locateFile: f => "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/" + f,
          });
          hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.55 });
          hands.onResults(r => { framesRef.current.hands = r.multiHandLandmarks || []; });
          handsRef.current = hands;
          setStatus("ready");
        } catch { setStatus("load-failed"); }
      }, []);

      const sendFrame = useCallback(async () => {
        const v = videoRef.current;
        if (!handsRef.current || !v || v.readyState < 2 || sending.current) return;
        const now = performance.now();
        if (now - lastSent.current < 33) return;
        lastSent.current = now; sending.current = true;
        try { await handsRef.current.send({ image: v }); } catch {}
        finally { sending.current = false; }
      }, []);

      useEffect(() => () => {
        const v = videoRef.current;
        if (v?.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
        handsRef.current?.close?.();
      }, []);

      return { status, start, sendFrame, framesRef, videoRef };
    }

    /* ── Camera gate ── */
    function CameraGate({ status, onStart }) {
      if (status === "ready") return null;

            <button className="cta ctaGhost" onClick={() => window.open(location.href,"_blank")}>OPEN IN NEW TAB</button>

    /* ── Draw App ── */
    const WCV = 640, HCV = 480;

    function DrawApp() {
      const [brushColor, setBrushColor] = useState("#ffd66b");
      const [brushSize,  setBrushSize]  = useState(8);
      const [gesture,    setGesture]    = useState("idle");
      const tracking = useHandTracking();
      const webcamRef  = useRef(null);
      const drawRef    = useRef(null);
      const overlayRef = useRef(null);
      const prevRef    = useRef(null);
      const undoStack  = useRef([]);
      const inStroke   = useRef(false);

      function snapshot(cv) {
        const ctx = cv.getContext("2d");
        undoStack.current.push(ctx.getImageData(0,0,cv.width,cv.height));
        if (undoStack.current.length > 20) undoStack.current.shift();
      }

      useEffect(() => {
        let rafId = 0;
        function frame() {
          const wc = webcamRef.current, dc = drawRef.current, oc = overlayRef.current;
          const v = tracking.videoRef.current;
          if (wc && dc && oc) {
            const wctx = wc.getContext("2d"), octx = oc.getContext("2d"), dctx = dc.getContext("2d");
            if (v && v.readyState >= 2 && tracking.status === "ready") {
              wctx.save(); wctx.scale(-1,1); wctx.drawImage(v,-WCV,0,WCV,HCV); wctx.restore();
              wctx.fillStyle = "rgba(29,30,34,0.42)"; wctx.fillRect(0,0,WCV,HCV);
            }
            octx.clearRect(0,0,WCV,HCV);
            if (tracking.status === "ready") {
              tracking.sendFrame();
              const lm = tracking.framesRef.current.hands[0] || null;
              const g  = lm ? classifyGesture(lm) : "idle";
              if (g !== gesture) setGesture(g);
              if (lm) {
                octx.save();
                octx.strokeStyle = "rgba(236,232,223,0.22)"; octx.lineWidth = 1.2;
                octx.beginPath();
                for (const [a,b] of HAND_CONNECTIONS) {
                  octx.moveTo((1-lm[a].x)*WCV, lm[a].y*HCV);
                  octx.lineTo((1-lm[b].x)*WCV, lm[b].y*HCV);
                }
                octx.stroke();
                octx.fillStyle = "rgba(236,232,223,0.55)";
                for (let i = 0; i < lm.length; i++) {
                  octx.beginPath(); octx.arc((1-lm[i].x)*WCV, lm[i].y*HCV, 2, 0, Math.PI*2); octx.fill();
                }
                octx.restore();
                const ix = (1-lm[8].x)*WCV, iy = lm[8].y*HCV;
                const px = (1-lm[9].x)*WCV, py = lm[9].y*HCV;
                if (g === "draw") {
                  if (!inStroke.current) {
                    snapshot(dc); inStroke.current = true; prevRef.current = {x:ix,y:iy};
                    dctx.fillStyle = brushColor; dctx.beginPath(); dctx.arc(ix,iy,brushSize/2,0,Math.PI*2); dctx.fill();
                  } else {
                    dctx.strokeStyle = brushColor; dctx.lineWidth = brushSize;
                    dctx.lineCap = "round"; dctx.lineJoin = "round";
                    dctx.shadowColor = brushColor; dctx.shadowBlur = 4;
                    dctx.beginPath(); dctx.moveTo(prevRef.current.x, prevRef.current.y); dctx.lineTo(ix,iy); dctx.stroke();
                    dctx.shadowBlur = 0; prevRef.current = {x:ix,y:iy};
                  }
                  octx.save(); octx.strokeStyle = brushColor; octx.lineWidth = 1.5;
                  octx.beginPath(); octx.arc(ix,iy,brushSize/2+4,0,Math.PI*2); octx.stroke(); octx.restore();
                } else if (g === "erase") {
                  const r = Math.max(brushSize*2.5, 35);
                  dctx.save(); dctx.globalCompositeOperation = "destination-out";
                  dctx.beginPath(); dctx.arc(px,py,r,0,Math.PI*2); dctx.fill(); dctx.restore();
                  octx.save(); octx.strokeStyle = "#ff6b6b"; octx.lineWidth = 1.6; octx.setLineDash([5,5]);
                  octx.beginPath(); octx.arc(px,py,r,0,Math.PI*2); octx.stroke(); octx.restore();
                  inStroke.current = false; prevRef.current = null;
                } else if (g === "pan") {
                  octx.save(); octx.strokeStyle = "#6ad7c8"; octx.lineWidth = 1.5;
                  octx.beginPath(); octx.arc(ix,iy,12,0,Math.PI*2); octx.stroke(); octx.restore();
                  inStroke.current = false; prevRef.current = null;
                } else {
                  inStroke.current = false; prevRef.current = null;
                }
              } else { inStroke.current = false; prevRef.current = null; }
            }
          }
          rafId = requestAnimationFrame(frame);
        }
        rafId = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(rafId);
      }, [tracking, brushColor, brushSize, gesture]);

      function undo() {
        const dc = drawRef.current; if (!dc) return;
        const snap = undoStack.current.pop();
        const ctx = dc.getContext("2d");
        if (snap) ctx.putImageData(snap,0,0); else ctx.clearRect(0,0,dc.width,dc.height);
      }
      function clear() {
        const dc = drawRef.current; if (!dc) return;
        snapshot(dc); dc.getContext("2d").clearRect(0,0,dc.width,dc.height);
      }
      function save() {
        const dc = drawRef.current, wc = webcamRef.current; if (!dc) return;
        const out = document.createElement("canvas"); out.width = dc.width; out.height = dc.height;
        const ctx = out.getContext("2d");
        ctx.fillStyle = "#1d1e22"; ctx.fillRect(0,0,out.width,out.height);
        if (wc) { ctx.globalAlpha = 0.55; ctx.drawImage(wc,0,0); ctx.globalAlpha = 1; }
        ctx.drawImage(dc,0,0);
        const a = document.createElement("a"); a.href = out.toDataURL("image/png"); a.download = "airdraw-draw.png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }

      return (
        <div>
          <Rail active="draw" />
          <div className="page appShell">
            <Toolbar mode="draw" onMode={m => { if (m==="magic") navigate("/magic"); }}
              gesture={gesture} brushColor={brushColor} setBrushColor={setBrushColor}
              brushSize={brushSize} setBrushSize={setBrushSize}
              particleColor="#ff3d8a" setParticleColor={() => {}} particleShape="star" setParticleShape={() => {}}
              onUndo={undo} onClear={clear} onSave={save} />
            <div className="canvasShell">
              <div className="canvasFrame">
                <canvas ref={webcamRef}  className="layer" width={WCV} height={HCV} />
                <canvas ref={drawRef}    className="layer" width={WCV} height={HCV} />
                <canvas ref={overlayRef} className="layer" width={WCV} height={HCV} />
                <span className="corner c1"/><span className="corner c2"/>
                <span className="corner c3"/><span className="corner c4"/>
                <CameraGate status={tracking.status} onStart={tracking.start} />
                {tracking.status === "ready" && (
                  <div className="hint">
                    <span className="l">☝ DRAW · ✋ ERASE · 👌 PAN</span>
                    <span className="r">{gesture === "idle" ? "SHOW A HAND" : "✓ TRACKING"}</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Magic App ── */
    function MagicApp() {
      const [particleColor, setParticleColor] = useState("#ff3d8a");
      const [particleShape, setParticleShape] = useState("star");
      const tracking  = useHandTracking();
      const webcamRef = useRef(null);
      const overlayRef = useRef(null);
      const particles  = useRef([]);

      useEffect(() => {
        let rafId = 0;
        function frame() {
          const wc = webcamRef.current, oc = overlayRef.current;
          const v = tracking.videoRef.current;
          if (wc && oc) {
            const wctx = wc.getContext("2d"), octx = oc.getContext("2d");
            if (v && v.readyState >= 2 && tracking.status === "ready") {
              wctx.save(); wctx.scale(-1,1); wctx.drawImage(v,-WCV,0,WCV,HCV); wctx.restore();
              wctx.fillStyle = "rgba(29,30,34,0.32)"; wctx.fillRect(0,0,WCV,HCV);
            }
            octx.clearRect(0,0,WCV,HCV);
            if (tracking.status === "ready") {
              tracking.sendFrame();
              const hands = tracking.framesRef.current.hands;
              const now = performance.now();

              if (hands.length > 0) {
                octx.save();
                octx.strokeStyle = particleColor; octx.globalAlpha = 0.55;
                octx.lineWidth = 1.1; octx.shadowColor = particleColor; octx.shadowBlur = 4;
                octx.beginPath();
                for (let h = 0; h < hands.length; h++) {
                  const lm = hands[h];
                  for (const [a,b] of HAND_CONNECTIONS) {
                    octx.moveTo((1-lm[a].x)*WCV, lm[a].y*HCV);
                    octx.lineTo((1-lm[b].x)*WCV, lm[b].y*HCV);
                  }
                }
                octx.stroke(); octx.restore();
              }

              if (hands.length === 2) {
                octx.save();
                octx.strokeStyle = "#ffffff"; octx.globalAlpha = 0.10; octx.lineWidth = 1;
                octx.beginPath();
                for (const ti of TIPS) {
                  const a = hands[0][ti], b = hands[1][ti];
                  octx.moveTo((1-a.x)*WCV, a.y*HCV); octx.lineTo((1-b.x)*WCV, b.y*HCV);
                }
                octx.stroke(); octx.restore();
              }

              for (let h = 0; h < hands.length; h++) {
                const lm = hands[h];
                if (isHandClosed(lm)) continue;
                for (let i = 0; i < lm.length; i++) {
                  const x = (1-lm[i].x)*WCV, y = lm[i].y*HCV;
                  const isTip = TIPS.includes(i);
                  if (Math.random() < (isTip ? 0.85 : 0.5))
                    spawnAt(particles.current, x, y, particleColor, particleShape, now, isTip ? 1.2 : 0.9);
                }
              }

              stepParticles(particles.current, now);
              renderParticles(octx, particles.current);

              if (hands.length > 0) {
                octx.save();
                octx.fillStyle = particleColor; octx.shadowColor = particleColor; octx.shadowBlur = 8;
                for (let h = 0; h < hands.length; h++) {
                  for (const lm of [hands[h]]) {
                    for (let i = 0; i < lm.length; i++) {
                      octx.beginPath(); octx.arc((1-lm[i].x)*WCV, lm[i].y*HCV, 2.5, 0, Math.PI*2); octx.fill();
                    }
                  }
                }
                octx.restore();
              }
            }
          }
          rafId = requestAnimationFrame(frame);
        }
        rafId = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(rafId);
      }, [tracking, particleColor, particleShape]);

      function clear() {
        particles.current.length = 0;
        if (overlayRef.current) overlayRef.current.getContext("2d").clearRect(0,0,WCV,HCV);
      }
      function save() {
        const oc = overlayRef.current, wc = webcamRef.current; if (!oc) return;
        const out = document.createElement("canvas"); out.width = oc.width; out.height = oc.height;
        const ctx = out.getContext("2d");
        ctx.fillStyle = "#1d1e22"; ctx.fillRect(0,0,out.width,out.height);
        if (wc) { ctx.globalAlpha = 0.55; ctx.drawImage(wc,0,0); ctx.globalAlpha = 1; }
        ctx.drawImage(oc,0,0);
        const a = document.createElement("a"); a.href = out.toDataURL("image/png"); a.download = "airdraw-magic.png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }

      const hasHands = tracking.framesRef.current.hands.length > 0;

      return (
        <div>
          <Rail active="magic" />
          <div className="page appShell">
            <Toolbar mode="magic" onMode={m => { if (m==="draw") navigate("/draw"); }}
              gesture={tracking.status === "ready" && hasHands ? "magic" : "idle"}
              brushColor="#ece8df" setBrushColor={() => {}} brushSize={6} setBrushSize={() => {}}
              particleColor={particleColor} setParticleColor={setParticleColor}
              particleShape={particleShape} setParticleShape={setParticleShape}
              onUndo={() => {}} onClear={clear} onSave={save} />
            <div className="canvasShell">
              <div className="canvasFrame">
                <canvas ref={webcamRef}  className="layer" width={WCV} height={HCV} />
                <canvas ref={overlayRef} className="layer" width={WCV} height={HCV} />
                <span className="corner c1"/><span className="corner c2"/>
                <span className="corner c3"/><span className="corner c4"/>
                <CameraGate status={tracking.status} onStart={tracking.start} />
                {tracking.status === "ready" && (
                  <div className="hint">
                    <span className="l">SHOW BOTH HANDS FOR A FULL WEB</span>
                    <span className="r">{hasHands ? "✦ CASTING" : "WAITING…"}</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── App root ── */
    function App() {
      const [route,  setRoute]  = useState(getRoute());
      const [fading, setFading] = useState(false);
      useEffect(() => {
        const onHash = () => {
          setFading(true);
          setTimeout(() => { setRoute(getRoute()); setFading(false); }, 220);
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      let page;
      if (route === "/draw")  page = <DrawApp />;
      else if (route === "/magic") page = <MagicApp />;
      else page = <Landing />;
      return <div className={"fader" + (fading ? " fading" : "")}>{page}</div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
