<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airdraw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,700&display=swap" rel="stylesheet" />

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg:        #3a3b3e;   /* warm mid-grey */
      --bg-2:      #34353a;
      --panel:     #2e2f33;
      --panel-2:   #404145;
      --line:      #4d4e53;
      --line-soft: #45464b;

      --ink:       #ece8df;   /* warm off-white */
      --ink-dim:   #b5afa1;
      --ink-mute:  #807a6e;

      --accent:    #ff3d8a;   /* hot magenta — the magic colour */
      --accent-2:  #ffd66b;   /* warm amber for draw */
      --accent-3:  #6ad7c8;   /* dusty teal */
      --accent-4:  #c8a8ff;   /* lavender */
      --danger:    #ff6b6b;
    }

    * { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: 'Fraunces', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    /* faint paper-grain */
    body::before {
      content:''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.18;
      mix-blend-mode: overlay;
    }
    body::after {
      content:''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(800px 540px at 85% 10%, rgba(255, 61, 138, 0.07), transparent 60%),
        radial-gradient(700px 500px at 8% 90%,  rgba(106, 215, 200, 0.06), transparent 60%);
    }
    #root { position: relative; z-index: 1; }

    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    a { color: inherit; text-decoration: none; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
    code { font-family: 'JetBrains Mono', monospace; }

    /* ───────────────── shared ───────────────── */
    .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; }
    .script { font-family: 'Allura', cursive; font-weight: 400; }

    /* ───────────────── side rail (vertical nav) ───────────────── */
    .rail {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 80px;
      border-right: 1px solid var(--line-soft);
      background: rgba(46, 47, 51, 0.55);
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 22px 0;
      z-index: 50;
    }
    .railMark {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: 'Allura', cursive; font-size: 30px;
      color: var(--ink); cursor: pointer;
      letter-spacing: 0.02em;
    }
    .railNav { display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .railLink {
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.28em; color: var(--ink-mute);
      padding: 6px 0;
      position: relative;
      transition: color 160ms ease;
    }
    .railLink:hover, .railLink.active { color: var(--ink); }
    .railLink.active::before {
      content: ''; position: absolute; left: -10px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 18px; background: var(--accent);
    }
    .railFoot { display: flex; flex-direction: column; gap: 14px; align-items: center;
      font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-mute);
      letter-spacing: 0.2em; }
    .railFoot .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.35} }

    /* ───────────────── page wrap ───────────────── */
    .page { padding-left: 80px; min-height: 100vh; }
    .container { padding: 0 56px; }

    /* ───────────────── top strip ───────────────── */
    .topStrip {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 56px 14px;
      border-bottom: 1px dashed var(--line-soft);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-mute); letter-spacing: 0.2em;
    }
    .topStrip .crosshair { display: flex; align-items: center; gap: 8px; }
    .topStrip .crosshair svg { color: var(--ink-dim); }

    /* ───────────────── hero ───────────────── */
    .hero {
      padding: 64px 56px 80px;
      display: grid; grid-template-columns: 1.05fr 1fr;
      gap: 56px;
      opacity: 0; transform: translateY(18px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .hero.in { opacity: 1; transform: translateY(0); }

    .heroLabel {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.28em; color: var(--accent);
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 28px;
    }
    .heroLabel .ln { width: 36px; height: 1px; background: var(--accent); display: inline-block; }

    .heroTitle {
      margin: 0;
      font-family: 'Fraunces', serif; font-weight: 400;
      font-size: clamp(58px, 7.6vw, 122px);
      line-height: 0.92;
      letter-spacing: -0.025em;
      color: var(--ink);
    }
    .heroTitle .scriptWord {
      font-family: 'Allura', cursive; font-weight: 400;
      font-size: 1.55em; line-height: 0.7;
      color: var(--accent);
      display: inline-block; padding: 0 0.04em;
      vertical-align: -0.06em;
    }
    .heroTitle .scriptWord.amber { color: var(--accent-2); }
    .heroTitle em { font-style: italic; font-weight: 300; color: var(--ink-dim); }

    .heroLead {
      max-width: 480px; margin-top: 28px;
      font-family: 'Fraunces', serif; font-weight: 300;
      font-size: 17px; line-height: 1.55; color: var(--ink-dim);
    }

    .ctaRow { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 32px; }
    .cta {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 22px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.22em; font-weight: 600;
      transition: transform 140ms ease, background 140ms ease, color 140ms ease;
      text-transform: uppercase;
    }
    .cta:hover { transform: translateY(-1px); }
    .ctaSolid {
      background: var(--ink); color: var(--bg);
    }
    .ctaSolid:hover { background: var(--accent-2); }
    .ctaMagic {
      background: var(--accent); color: var(--bg);
    }
    .ctaMagic:hover { background: #ff6aa6; }
    .ctaGhost {
      border: 1px solid var(--line); color: var(--ink-dim);
    }
    .ctaGhost:hover { color: var(--ink); border-color: var(--ink-dim); }
    .cta .arr { font-family: 'Allura', cursive; font-size: 22px; letter-spacing: 0; line-height: 0; }

    .heroSpecs {
      display: flex; gap: 0; margin-top: 56px;
      border-top: 1px solid var(--line-soft);
      padding-top: 22px;
    }
    .spec { padding-right: 36px; margin-right: 36px;
      border-right: 1px solid var(--line-soft); }
    .spec:last-child { border-right: none; }
    .spec .v { font-family: 'Allura', cursive; font-size: 40px; line-height: 1;
      color: var(--ink); }
    .spec .l { font-family: 'JetBrains Mono', monospace; font-size: 9px;
      color: var(--ink-mute); letter-spacing: 0.24em; margin-top: 4px; }

    /* hero right side */
    .heroRight {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .heroCard {
      position: relative; width: 100%; max-width: 560px; aspect-ratio: 4/3;
      background: #232428;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .heroCard canvas { display: block; width: 100%; height: 100%; }
    .heroCard::before {
      content:''; position: absolute; inset:0;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.55);
      pointer-events: none; z-index: 2;
    }
    .heroCard .tag {
      position: absolute; top: 16px; left: 18px; z-index: 3;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-dim); letter-spacing: 0.24em;
      display: flex; align-items: center; gap: 8px;
    }
    .heroCard .tag .d { width:6px; height:6px; border-radius:50%; background: var(--accent);
      box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s ease-in-out infinite; }
    .heroCard .corner {
      position: absolute; width: 22px; height: 22px; border: 1px solid var(--accent);
      z-index: 3;
    }
    .heroCard .c1 { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .heroCard .c2 { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .heroCard .c3 { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .heroCard .c4 { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .heroCardCaption {
      position: absolute; right: -14px; top: 50%;
      transform: rotate(90deg) translate(40px, 14px);
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-mute); letter-spacing: 0.28em;
      pointer-events: none;
    }

    @media (max-width: 1000px) {
      .hero { grid-template-columns: 1fr; padding: 48px 28px; gap: 40px; }
      .heroCardCaption { display: none; }
    }
    @media (max-width: 700px) {
      .page { padding-left: 0; }
      .rail { position: relative; width: 100%; height: 56px;
        flex-direction: row; padding: 0 18px; border-right: none;
        border-bottom: 1px solid var(--line-soft); }
      .railMark, .railLink { writing-mode: horizontal-tb; transform: none; }
      .railFoot { display: none; }
      .topStrip { padding: 14px 28px; }
      .container { padding: 0 28px; }
    }

    /* ───────────────── chapter (mode) cards ───────────────── */
    .chapters {
      display: grid; grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--line-soft);
    }
    .chapter {
      padding: 56px 48px;
      border-right: 1px solid var(--line-soft);
      display: flex; flex-direction: column; gap: 16px;
      position: relative; overflow: hidden;
      transition: background 200ms ease;
    }
    .chapter:hover { background: rgba(0,0,0,0.08); }
    .chapter:last-child { border-right: none; }
    .chapter .num {
      font-family: 'Fraunces', serif; font-weight: 300;
      font-size: 80px; line-height: 1;
      color: var(--ink-mute);
      letter-spacing: -0.03em;
    }
    .chapter .name {
      font-family: 'Allura', cursive; font-size: 96px; line-height: 0.85;
      margin: -8px 0 0;
    }
    .chapter.draw  .name { color: var(--accent-2); }
    .chapter.magic .name { color: var(--accent); }
    .chapter .body {
      font-family: 'Fraunces', serif; font-size: 16px; line-height: 1.55;
      color: var(--ink-dim); max-width: 420px; margin-top: 6px;
    }
    .chapter .glist {
      margin-top: 14px; display: flex; flex-direction: column; gap: 10px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-dim);
    }
    .glist .r { display: flex; align-items: center; gap: 12px; }
    .glist .r .g {
      width: 28px; height: 28px; display: inline-flex;
      align-items: center; justify-content: center;
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace; font-size: 14px;
    }
    .chapter .open {
      margin-top: 24px; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 12px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.22em; color: var(--ink);
      padding-bottom: 6px; border-bottom: 1px solid currentColor;
    }
    .chapter .open .arr { font-family: 'Allura', cursive; font-size: 22px; line-height: 0; }

    @media (max-width: 900px) {
      .chapters { grid-template-columns: 1fr; }
      .chapter { border-right: none; border-bottom: 1px solid var(--line-soft); }
      .chapter:last-child { border-bottom: none; }
    }

    /* ───────────────── notes/strip ───────────────── */
    .notesRow {
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
    }
    .note {
      padding: 28px 32px;
      border-right: 1px solid var(--line-soft);
      display: flex; flex-direction: column; gap: 10px;
    }
    .note:last-child { border-right: none; }
    .note .h { font-family: 'Allura', cursive; font-size: 30px; line-height: 1;
      color: var(--ink); }
    .note .b { font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-dim); line-height: 1.6; letter-spacing: 0.04em; }

    @media (max-width: 900px) {
      .notesRow { grid-template-columns: 1fr 1fr; }
      .note:nth-child(2) { border-right: none; }
      .note:nth-child(1), .note:nth-child(2) { border-bottom: 1px solid var(--line-soft); }
    }

    /* ───────────────── how ───────────────── */
    .how {
      padding: 80px 56px;
      display: grid; grid-template-columns: 1fr 2fr; gap: 56px;
      border-bottom: 1px solid var(--line-soft);
    }
    .how .h { font-family: 'Allura', cursive; font-size: 92px;
      line-height: 0.85; color: var(--ink); }
    .steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; }
    .step { display: flex; flex-direction: column; gap: 10px;
      border-top: 1px solid var(--line-soft); padding-top: 18px; }
    .step .n { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--accent); letter-spacing: 0.22em; }
    .step .t { font-family: 'Fraunces', serif; font-size: 22px; color: var(--ink); font-weight: 400; }
    .step .d { font-family: 'Fraunces', serif; font-size: 14px;
      color: var(--ink-dim); line-height: 1.6; font-weight: 300; }

    @media (max-width: 900px) {
      .how { grid-template-columns: 1fr; padding: 56px 28px; gap: 28px; }
      .steps { grid-template-columns: 1fr; }
    }

    /* ───────────────── footer ───────────────── */
    .footer {
      padding: 32px 56px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-mute); letter-spacing: 0.16em;
    }
    .footer .center {
      font-family: 'Allura', cursive; font-size: 44px; line-height: 1;
      color: var(--ink); letter-spacing: 0;
    }
    .footer .r { text-align: right; }

    @media (max-width: 700px) {
      .footer { padding: 24px 28px; grid-template-columns: 1fr; text-align: center; }
      .footer .r { text-align: center; }
    }

    /* ───────────────── toolbar (app pages) ───────────────── */
    .toolbar {
      height: 60px; width: 100%;
      background: rgba(46, 47, 51, 0.72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line-soft);
      display: flex; align-items: center;
      padding: 0 28px; gap: 24px;
      position: relative; z-index: 10;
    }
    .tbL, .tbC, .tbR { display: flex; align-items: center; gap: 16px; }
    .tbC { flex: 1; justify-content: center; }
    .tbR { justify-content: flex-end; }

    .tbMark {
      font-family: 'Allura', cursive; font-size: 32px; color: var(--ink);
      line-height: 1; cursor: pointer;
    }

    .modeTabs { display: flex; gap: 0; border-left: 1px solid var(--line-soft);
      border-right: 1px solid var(--line-soft); height: 60px; }
    .modeTab {
      padding: 0 18px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-mute); letter-spacing: 0.24em;
      border-right: 1px solid var(--line-soft);
      transition: color 140ms ease, background 140ms ease;
    }
    .modeTab:last-child { border-right: none; }
    .modeTab.activeDraw  { color: var(--accent-2); background: rgba(255, 214, 107, 0.06); }
    .modeTab.activeMagic { color: var(--accent);   background: rgba(255, 61, 138, 0.06); }

    .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.18em; padding: 7px 12px;
      border: 1px solid currentColor; }

    .brushControls { display: flex; align-items: center; gap: 12px; }
    .range { width: 140px; height: 16px; }
    .range::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
    .range::-moz-range-track { height: 2px; background: var(--line); }
    .range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; background: var(--accent-2); border: none; margin-top: -5px; }
    .range::-moz-range-thumb { width: 12px; height: 12px; background: var(--accent-2); border: none; }
    .weight { font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--ink-dim); min-width: 22px; text-align: right; letter-spacing: 0.06em; }

    .swatches { display: flex; gap: 10px; padding-left: 4px; }
    .swatch { width: 16px; height: 16px; padding: 0; border: none; }
    .swatch:hover { transform: scale(1.18); }
    .swatch.active { outline: 1px solid var(--ink); outline-offset: 3px; }

    .shapeButtons { display: flex; gap: 0; border: 1px solid var(--line); }
    .shapeBtn { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-mute); padding: 6px 10px; border-right: 1px solid var(--line);
      letter-spacing: 0.1em; }
    .shapeBtn:last-child { border-right: none; }
    .shapeBtn.active { color: var(--bg); background: var(--accent); }

    .iconRow { display: flex; gap: 0; border: 1px solid var(--line); }
    .iconBtn { width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-right: 1px solid var(--line); color: var(--ink-dim); }
    .iconBtn:last-child { border-right: none; }
    .iconBtn:hover { color: var(--ink); background: rgba(0,0,0,0.18); }

    /* ───────────────── app canvas ───────────────── */
    .appShell { display: flex; flex-direction: column; min-height: 100vh; }
    .canvasShell {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 28px;
    }
    .canvasFrame {
      position: relative; width: 100%;
      max-width: min(100%, calc((100vh - 132px) * 4 / 3));
      aspect-ratio: 4 / 3;
      background: #1d1e22;
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow:
        inset 0 0 120px rgba(0,0,0,0.55),
        0 30px 80px -30px rgba(0,0,0,0.6);
    }
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .corner { position: absolute; width: 22px; height: 22px; border: 1px solid var(--ink-dim);
      z-index: 4; pointer-events: none; }
    .corner.c1 { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .corner.c2 { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .corner.c3 { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .corner.c4 { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    .gate {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(29, 30, 34, 0.94);
      text-align: center; padding: 32px; gap: 18px;
    }
    .gate .big {
      font-family: 'Allura', cursive; font-size: 74px;
      color: var(--ink); line-height: 0.9;
    }
    .gate .sub {
      font-family: 'Fraunces', serif; font-weight: 300;
      font-size: 16px; color: var(--ink-dim); max-width: 440px; line-height: 1.55;
    }
    .gate .acts { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
    .gate code { color: var(--accent-2); }

    .hint {
      position: absolute; bottom: 18px; left: 18px; right: 18px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--ink-dim); letter-spacing: 0.2em;
      pointer-events: none;
      z-index: 5;
    }
    .hint .l, .hint .r {
      padding: 7px 12px;
      background: rgba(29, 30, 34, 0.72);
      border: 1px solid var(--line);
    }

    .fader { opacity: 1; transition: opacity 220ms ease; }
    .fader.fading { opacity: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react" src="preview.jsx"></script>
</body>
</html>
